name: nats-agent release

on:
  push:
    tags:
      - "nats-agent/v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nats-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nats-agent/go.mod
          cache-dependency-path: nats-agent/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    defaults:
      run:
        working-directory: nats-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: nats-agent/go.mod
          cache-dependency-path: nats-agent/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#nats-agent/}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/Superm4n97/helm-artifacts/nats-agent/cmd.Version=${VERSION}" \
            -o "dist/nats-agent-${GOOS}-${GOARCH}" .

      - uses: actions/upload-artifact@v4
        with:
          name: nats-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nats-agent/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum nats-agent-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nats-agent ${GITHUB_REF_NAME#nats-agent/}" \
            --generate-notes
